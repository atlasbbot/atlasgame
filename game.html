      const bw = m[0].length, bh = m.length;
      const s2 = cell*0.62;
      const sx = nbX + (nbS - bw*s2)/2;
      const sy = nbY + cell*1.2 + (cell*2 - bh*s2)/2;
      for(let y=0;y<bh;y++) for(let x=0;x<bw;x++){
        if(!m[y][x]) continue;
        const px = sx + x*s2, py = sy + y*s2;
        ctx.fillStyle = next.c;
        ctx.shadowBlur = 12; ctx.shadowColor = next.c;
        ctx.beginPath(); ctx.roundRect(px+2, py+2, s2-4, s2-4, 5); ctx.fill();
        ctx.shadowBlur = 0;
      }
    },

    restart(){ reset(); }
  };
}

/* ============================================================
   GAME 10 — PONG
   ============================================================ */
function makePong(ctx, W, H, api){
  let p1, p2, ball, score1, score2, over, serveT, speed;

  function reset(){
    const ph = Math.min(H*0.22, 120);
    const pw = Math.min(W*0.022, 16);
    p1 = {x: W*0.045, y: H/2, w:pw, h:ph, vy:0};
    p2 = {x: W*0.955 - pw, y: H/2, w:pw, h:ph, vy:0};
    ball = {x:W/2, y:H/2, r: Math.min(W,H)*0.018, vx:0, vy:0};
    score1 = 0; score2 = 0; over = false; serveT = 0.8; speed = Math.min(W,H)*0.62;
    serve();
  }
  function serve(){
    const a = rand(-0.42, 0.42) + (Math.random()<0.5 ? 0 : Math.PI);
    ball.vx = Math.cos(a)*speed;
    ball.vy = Math.sin(a)*speed*0.75;
    ball.x = W/2; ball.y = H/2;
  }
  reset();

  return {
    get hud(){ return `👤 ${score1}   —   🤖 ${score2}`; },
    resize(){ reset(); },
    destroy(){},

    update(dt){
      if(over) return;
      if(serveT > 0){ serveT -= dt; return; }

      // player paddle
      p1.y = clamp(p1.y + api.input.move.y * H * 1.15 * dt, p1.h/2, H-p1.h/2);

      // AI
      const target = ball.y - p2.h*0.1 * (ball.vx > 0 ? 1 : 0.35);
      const diff = target - p2.y;
      const aiSpeed = H * (0.62 + Math.max(0, 1 - Math.abs(diff)/H) * 0.55);
      p2.y += clamp(diff, -aiSpeed*dt, aiSpeed*dt);
      p2.y = clamp(p2.y, p2.h/2, H-p2.h/2);

      // ball
      const steps = Math.max(1, Math.ceil(Math.hypot(ball.vx, ball.vy)*dt/(ball.r*0.7)));
      const sdt = dt/steps;
      for(let s=0;s<steps;s++){
        ball.x += ball.vx*sdt;
        ball.y += ball.vy*sdt;

        if(ball.y-ball.r < 0){ ball.y = ball.r; ball.vy = Math.abs(ball.vy); api.sfx.hit(); }
        if(ball.y+ball.r > H){ ball.y = H-ball.r; ball.vy = -Math.abs(ball.vy); api.sfx.hit(); }

        // p1
        if(ball.vx < 0 && ball.x-ball.r < p1.x+p1.w && ball.x+ball.r > p1.x &&
           ball.y > p1.y-p1.h/2 && ball.y < p1.y+p1.h/2){
          ball.x = p1.x+p1.w+ball.r;
          const hit = (ball.y - p1.y)/(p1.h/2);
          const sp = Math.min(Math.hypot(ball.vx,ball.vy)*1.06, Math.min(W,H)*1.5);
          ball.vx = Math.abs(Math.cos(hit*0.9)*sp);
          ball.vy = Math.sin(hit*0.9)*sp;
          api.sfx.tone(760,.05,'square',.035);
        }
        // p2
        if(ball.vx > 0 && ball.x+ball.r > p2.x && ball.x-ball.r < p2.x+p2.w &&
           ball.y > p2.y-p2.h/2 && ball.y < p2.y+p2.h/2){
          ball.x = p2.x-ball.r;
          const hit = (ball.y - p2.y)/(p2.h/2);
          const sp = Math.min(Math.hypot(ball.vx,ball.vy)*1.06, Math.min(W,H)*1.5);
          ball.vx = -Math.abs(Math.cos(hit*0.9)*sp);
          ball.vy = Math.sin(hit*0.9)*sp;
          api.sfx.tone(520,.05,'square',.03);
        }

        if(ball.x < -30){
          score2++; api.sfx.down(); serveT = 0.7; serve();
          if(score2 >= 7){ over=true; api.gameOver(score1); return; }
        }
        if(ball.x > W+30){
          score1++; api.sfx.coin(); serveT = 0.7; serve();
          if(score1 >= 7){ over=true; api.win(score1); return; }
        }
      }
    },

    render(){
      ctx.fillStyle = '#04060c'; ctx.fillRect(0,0,W,H);

      // center line
      ctx.strokeStyle = 'rgba(182,255,60,0.22)';
      ctx.lineWidth = 3;
      ctx.setLineDash([12, 16]);
      ctx.beginPath();
      ctx.moveTo(W/2, 0); ctx.lineTo(W/2, H);
      ctx.stroke();
      ctx.setLineDash([]);

      // center circle
      ctx.strokeStyle = 'rgba(182,255,60,0.10)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(W/2, H/2, Math.min(W,H)*0.16, 0, TAU); ctx.stroke();

      // scores
      ctx.fillStyle = 'rgba(182,255,60,0.14)';
      ctx.font = `900 ${Math.min(W,H)*0.20}px Segoe UI, sans-serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(String(score1), W*0.28, H*0.24);
      ctx.fillText(String(score2), W*0.72, H*0.24);

      // paddles
      ctx.shadowBlur = 22;
      ctx.shadowColor = '#00e5ff';
      ctx.fillStyle = '#00e5ff';
      ctx.beginPath();
      ctx.roundRect(p1.x, p1.y-p1.h/2, p1.w, p1.h, p1.w/2);
      ctx.fill();

      ctx.shadowColor = '#ff2e88';
      ctx.fillStyle = '#ff2e88';
      ctx.beginPath();
      ctx.roundRect(p2.x, p2.y-p2.h/2, p2.w, p2.h, p2.w/2);
      ctx.fill();

      // ball
      ctx.shadowColor = '#fff';
      ctx.shadowBlur = 28;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;

      // trail
      for(let i=1;i<=6;i++){
        ctx.globalAlpha = 0.10/i;
        ctx.beginPath();
        ctx.arc(ball.x - ball.vx*0.008*i, ball.y - ball.vy*0.008*i, ball.r*(1-i*0.10), 0, TAU);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;
    },

    restart(){ reset(); }
  };
}

/* ============================================================
   GAME 11 — TANK
   ============================================================ */
function makeTank(ctx, W, H, api){
  let tank, enemies, bullets, ebullets, walls, score, lives, over, spawnT, wave, particles;

  function buildWalls(){
    const ws = [];
    const s = Math.min(W,H)*0.055;
    // fixed pattern scaled to screen
    const layout = [
      [0.15,0.22,2.6,0.5],[0.72,0.22,2.6,0.5],
      [0.15,0.75,2.6,0.5],[0.72,0.75,2.6,0.5],
      [0.44,0.40,1.2,1.2],[0.44,0.60,1.2,1.2],
      [0.05,0.48,0.5,1.2],[0.90,0.48,0.5,1.2]
    ];
    for(const [x,y,w,h] of layout){
      ws.push({x:W*x, y:H*y, w:s*w, h:s*h});
    }
    return ws;
  }

  function reset(){
    tank = {x:W/2, y:H/2, r:Math.min(W,H)*0.028, ang:-Math.PI/2, cool:0, inv:0};
    enemies = []; bullets = []; ebullets = [];
    walls = buildWalls();
    score = 0; lives = 3; over = false; spawnT = 0; wave = 1;
    particles = [];
  }
  reset();

  function circleRect(cx, cy, r, rect){
    const nx = clamp(cx, rect.x, rect.x+rect.w);
    const ny = clamp(cy, rect.y, rect.y+rect.h);
    return (cx-nx)**2 + (cy-ny)**2 < r*r;
  }
  function blocked(x, y, r){
    if(x-r < 0 || y-r < 0 || x+r > W || y+r > H) return true;
    for(const w of walls) if(circleRect(x,y,r,w)) return true;
    return false;
  }

  return {
    get hud(){ return `🎯 ${score}   ❤️ ${lives}   🌊 ${wave}`; },
    resize(){ reset(); },
    destroy(){},

    update(dt){
      if(over) return;
      if(tank.inv > 0) tank.inv -= dt;

      const ix = api.input.move.x, iy = api.input.move.y;

      // move in stick direction
      const mag = Math.hypot(ix, iy);
      if(mag > 0.14){
        const sp = Math.min(W,H)*0.42 * Math.min(1,mag) * dt;
        const nx = tank.x + ix/mag*sp;
        const ny = tank.y + iy/mag*sp;
        if(!blocked(nx, tank.y, tank.r)) tank.x = nx;
        if(!blocked(tank.x, ny, tank.r)) tank.y = ny;
        // turret rotates to move dir
        const t = Math.atan2(iy, ix);
        let d = t - tank.ang;
        while(d >  Math.PI) d -= TAU;
        while(d < -Math.PI) d += TAU;
        tank.ang += d * Math.min(1, dt*9);
      }

      // shoot
      tank.cool -= dt;
      if(api.input.action && tank.cool <= 0){
        tank.cool = 0.34;
        bullets.push({
          x: tank.x + Math.cos(tank.ang)*(tank.r+6),
          y: tank.y + Math.sin(tank.ang)*(tank.r+6),
          vx: Math.cos(tank.ang)*Math.min(W,H)*1.25,
          vy: Math.sin(tank.ang)*Math.min(W,H)*1.25,
          life: 1.6
        });
        api.sfx.tone(300,.09,'sawtooth',.04);
      }

      // spawn
      spawnT -= dt;
      if(spawnT <= 0 && enemies.length < 6){
        spawnT = Math.max(0.55, 1.7 - wave*0.14);
        let ex, ey, guard=0;
        do{
          ex = rand(W*0.08, W*0.92);
          ey = rand(H*0.08, H*0.92);
          guard++;
        }while(blocked(ex,ey,Math.min(W,H)*0.03) && guard < 40);
        enemies.push({
          x:ex, y:ey, r:Math.min(W,H)*0.028,
          ang:0, cool: rand(0.6,1.6),
          hp: 1 + Math.floor(wave/3), maxhp: 1 + Math.floor(wave/3),
          hue: 0
        });
      }

      // player bullets
      for(let i=bullets.length-1;i>=0;i--){
        const b = bullets[i];
        b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
        let dead = b.life <= 0 || b.x<0||b.y<0||b.x>W||b.y>H;
        if(!dead){
          for(const w of walls) if(circleRect(b.x,b.y,4,w)){ dead = true; break; }
        }
        if(!dead){
          for(let j=enemies.length-1;j>=0;j--){
            const e = enemies[j];
            if(Math.hypot(b.x-e.x, b.y-e.y) < e.r+5){
              e.hp--; dead = true;
              for(let k=0;k<6;k++) particles.push({
                x:e.x, y:e.y, vx:rand(-200,200), vy:rand(-200,200), life:.4, hue:35
              });
              if(e.hp <= 0){
                enemies.splice(j,1); score += 30; api.sfx.boom();
                for(let k=0;k<16;k++) particles.push({
                  x:e.x, y:e.y, vx:rand(-320,320), vy:rand(-320,320), life:.7, hue:15
                });
              } else api.sfx.hit();
              break;
            }
          }
        }
        if(dead) bullets.splice(i,1);
      }

      // enemies
      for(const e of enemies){
        const dx = tank.x-e.x, dy = tank.y-e.y;
        const d = Math.hypot(dx,dy) || 1;
        e.ang = Math.atan2(dy,dx);
        if(d > Math.min(W,H)*0.22){
          const sp = Math.min(W,H)*0.13*dt;
          const nx = e.x + dx/d*sp, ny = e.y + dy/d*sp;
          if(!blocked(nx, e.y, e.r)) e.x = nx;
          if(!blocked(e.x, ny, e.r)) e.y = ny;
        }
        e.cool -= dt;
        if(e.cool <= 0 && d < Math.min(W,H)*0.65){
          e.cool = rand(1.1, 2.2);
          ebullets.push({
            x:e.x+Math.cos(e.ang)*(e.r+5), y:e.y+Math.sin(e.ang)*(e.r+5),
            vx: Math.cos(e.ang)*Math.min(W,H)*0.75,
            vy: Math.sin(e.ang)*Math.min(W,H)*0.75,
            life: 2.2
          });
          api.sfx.tone(220,.07,'sawtooth',.025);
        }
        if(tank.inv <= 0 && d < e.r + tank.r){
          e.hp--; api.sfx.boom();
          if(e.hp <= 0){ enemies.splice(enemies.indexOf(e),1); score += 30; }
          hitTank();
          if(over) return;
        }
      }

      // enemy bullets
      for(let i=ebullets.length-1;i>=0;i--){
        const b = ebullets[i];
        b.x += b.vx*dt; b.y += b.vy*dt; b.life -= dt;
        let dead = b.life<=0 || b.x<0||b.y<0||b.x>W||b.y>H;
        if(!dead) for(const w of walls) if(circleRect(b.x,b.y,4,w)){ dead = true; break; }
        if(!dead && tank.inv <= 0 && Math.hypot(b.x-tank.x, b.y-tank.y) < tank.r+5){
          dead = true; hitTank();
          if(over) return;
        }
        if(dead) ebullets.splice(i,1);
      }

      // particles
      for(let i=particles.length-1;i>=0;i--){
        const p = particles[i];
        p.x += p.vx*dt; p.y += p.vy*dt;
        p.vx *= 0.94; p.vy *= 0.94;
        p.life -= dt;
        if(p.life <= 0) particles.splice(i,1);
      }

      const nw = 1 + Math.floor(score/250);
      if(nw > wave){ wave = nw; api.sfx.up(); }
    },

    render(){
      const bg = ctx.createLinearGradient(0,0,0,H);
      bg.addColorStop(0,'#0a1008'); bg.addColorStop(1,'#04060a');
      ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

      // grid
      ctx.strokeStyle = 'rgba(182,255,60,0.045)';
      ctx.lineWidth = 1;
      const gs = Math.min(W,H)/16;
      for(let x=0;x<W;x+=gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
      for(let y=0;y<H;y+=gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }

      // walls
      for(const w of walls){
        const g = ctx.createLinearGradient(w.x, w.y, w.x, w.y+w.h);
        g.addColorStop(0,'#4a5a3a'); g.addColorStop(0.4,'#2e3a24'); g.addColorStop(1,'#1a2214');
        ctx.fillStyle = g;
        ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(182,255,60,0.22)';
        ctx.beginPath(); ctx.roundRect(w.x, w.y, w.w, w.h, 7); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = 'rgba(182,255,60,0.14)';
        ctx.fillRect(w.x+2, w.y+2, w.w-4, 2.5);
      }

      // particles
      for(const p of particles){
        ctx.globalAlpha = clamp(p.life*2.2,0,1);
        ctx.fillStyle = `hsl(${p.hue},95%,62%)`;
        ctx.fillRect(p.x-2.5, p.y-2.5, 5, 5);
      }
      ctx.globalAlpha = 1;

      // enemies
      for(const e of enemies){
        ctx.save();
        ctx.translate(e.x, e.y);
        ctx.rotate(e.ang);
        ctx.shadowBlur = 16; ctx.shadowColor = '#ff3b5c';
        // body
        ctx.fillStyle = '#8a1024';
        ctx.beginPath(); ctx.roundRect(-e.r, -e.r*0.85, e.r*2, e.r*1.7, e.r*0.35); ctx.fill();
        // barrel
        ctx.fillStyle = '#c02040';
        ctx.fillRect(e.r*0.5, -e.r*0.20, e.r*1.1, e.r*0.40);
        // turret
        ctx.fillStyle = '#ff3b5c';
        ctx.beginPath(); ctx.arc(0,0,e.r*0.62,0,TAU); ctx.fill();
        ctx.shadowBlur = 0;
        // hp
        if(e.maxhp > 1){
          ctx.rotate(-e.ang);
          ctx.fillStyle = 'rgba(255,255,255,0.8)';
          const pw = e.r*1.6/e.maxhp;
          for(let i=0;i<e.hp;i++) ctx.fillRect(-e.r*0.8 + i*pw, -e.r*1.35, pw*0.7, 3);
        }
        ctx.restore();
      }

      // enemy bullets
      for(const b of ebullets){
        ctx.shadowBlur = 14; ctx.shadowColor = '#ff3b5c';
        ctx.fillStyle = '#ff8fa3';
        ctx.beginPath(); ctx.arc(b.x, b.y, 4.2, 0, TAU); ctx.fill();
      }
      ctx.shadowBlur = 0;

      // player bullets
      for(const b of bullets){
        ctx.shadowBlur = 16; ctx.shadowColor = '#b6ff3c';
        ctx.fillStyle = '#e6ffb0';
        ctx.beginPath(); ctx.arc(b.x, b.y, 4.6, 0, TAU); ctx.fill();
      }
      ctx.shadowBlur = 0;

      // player tank
      if(tank.inv <= 0 || Math.floor(performance.now()/80)%2){
        ctx.save();
        ctx.translate(tank.x, tank.y);
        ctx.rotate(tank.ang);
        ctx.shadowBlur = 20; ctx.shadowColor = '#b6ff3c';

        const bg2 = ctx.createLinearGradient(0,-tank.r,0,tank.r);
        bg2.addColorStop(0,'#4a6b1a'); bg2.addColorStop(0.5,'#2e4a10'); bg2.addColorStop(1,'#16240a');
        ctx.fillStyle = bg2;
        ctx.beginPath(); ctx.roundRect(-tank.r, -tank.r*0.85, tank.r*2, tank.r*1.7, tank.r*0.35); ctx.fill();

        // treads
        ctx.fillStyle = 'rgba(0,0,0,0.5)';
        ctx.fillRect(-tank.r*1.02, -tank.r*0.92, tank.r*0.28, tank.r*1.84);
        ctx.fillRect( tank.r*0.74, -tank.r*0.92, tank.r*0.28, tank.r*1.84);

        // barrel
        ctx.fillStyle = '#6b8f2a';
        ctx.fillRect(tank.r*0.4, -tank.r*0.18, tank.r*1.25, tank.r*0.36);

        // turret
        ctx.fillStyle = '#b6ff3c';
        ctx.beginPath(); ctx.arc(0,0,tank.r*0.60,0,TAU); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.beginPath(); ctx.arc(0,0,tank.r*0.30,0,TAU); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    },

    restart(){ reset(); }
  };

  function hitTank(){
    lives--; api.sfx.boom(); tank.inv = 1.5;
    if(lives <= 0){ over = true; api.gameOver(score); }
  }
}

/* ============================================================
   [APP CONTROLLER]
   ============================================================ */
const App = {
  canvas:null, ctx:null, W:0, H:0,
  game:null, gameObj:null,
  filter:'all', query:'',
  lastT:0, fpsAcc:0, fpsFrames:0, fps:60, fpsT:0,
  dpr:Device.dpr,

  init(){
    this.canvas = $('#game');
    this.ctx = this.canvas.getContext('2d', {alpha:false, desynchronized:true});

    Input.init();
    this.buildFilters();
    this.renderGrid();
    this.bindUI();
    this.bindTouch();
    this.startLoop();

    // first user gesture unlocks audio
    const unlock = ()=>{ Sfx.init(); Sfx.ctx?.resume?.(); };
    addEventListener('pointerdown', unlock, {once:true});
    addEventListener('keydown', unlock, {once:true});

    // resize
    addEventListener('resize', ()=>this.resize());
    addEventListener('orientationchange', ()=>setTimeout(()=>this.resize(), 220));
  },

  /* ---------- UI ---------- */
  buildFilters(){
    const tags = new Set();
    GAMES.forEach(g=>g.tags.forEach(t=>tags.add(t)));
    const list = ['الكل', ...tags];
    const el = $('#filters');
    el.innerHTML = list.map((t,i)=>
      `<button class="chip${i===0?' on':''}" data-f="${i===0?'all':t}">${t}</button>`
    ).join('');
    el.addEventListener('click', e=>{
      const b = e.target.closest('.chip');
      if(!b) return;
      $$('.chip').forEach(c=>c.classList.remove('on'));
      b.classList.add('on');
      this.filter = b.dataset.f;
      this.renderGrid();
    });
  },

  renderGrid(){
    const q = this.query.trim().toLowerCase();
    const list = GAMES.filter(g=>{
      const okF = this.filter === 'all' || g.tags.includes(this.filter);
      const okQ = !q || g.title.toLowerCase().includes(q) ||
                  g.desc.toLowerCase().includes(q) ||
                  g.tags.some(t=>t.toLowerCase().includes(q));
      return okF && okQ;
    });

    const grid = $('#grid');
    grid.innerHTML = list.map((g,i)=>`
      <article class="card" data-id="${g.id}" tabindex="0"
               style="--c1:${g.c1};--c2:${g.c2};--accent:${g.accent};animation-delay:${i*40}ms">
        <div class="cover">
          <div class="scan"></div>
          <span class="badge${g.is3D?' d3':''}">${g.is3D?'3D':'2D'}</span>
          <span class="ico">${g.icon}</span>
        </div>
        <div class="meta">
          <h3>${g.title}</h3>
          <p>${g.desc}</p>
          <div class="tags">
            ${g.tags.map(t=>`<span class="tag a">${t}</span>`).join('')}
          </div>
        </div>
      </article>
    `).join('');

    grid.onclick = e=>{
      const c = e.target.closest('.card');
      if(c) this.open(c.dataset.id);
    };
    grid.onkeydown = e=>{
      if(e.key==='Enter'){
        const c = e.target.closest('.card');
        if(c) this.open(c.dataset.id);
      }
    };
  },

  bindUI(){
    $('#q').addEventListener('input', e=>{
      this.query = e.target.value;
      clearTimeout(this._qt);
      this._qt = setTimeout(()=>this.renderGrid(), 130);
    });

    $('#btnExit').onclick   = ()=>this.exit();
    $('#btnFull').onclick   = ()=>this.toggleFull();
    $('#mAgain').onclick    = ()=>{ $('#modal').classList.remove('on'); this.gameObj?.restart?.(); };
    $('#mExit').onclick     = ()=>{ $('#modal').classList.remove('on'); this.exit(); };

    // Fullscreen API
    document.addEventListener('fullscreenchange', ()=>{
      setTimeout(()=>this.resize(), 90);
    });
  },

  bindTouch(){
    const stick = $('#stick'), knob = $('#knob');
    let active = null;

    const setKnob = (dx,dy,max)=>{
      knob.style.transform = `translate(${dx}px, ${dy}px)`;
      Input.sx = clamp(dx/max, -1, 1);
      Input.sy = clamp(dy/max, -1, 1);
    };
    const resetKnob = ()=>{
      knob.style.transform = 'translate(0,0)';
      knob.classList.remove('act');
      Input.sx = Input.sy = 0;
    };

    const onMove = e=>{
      if(active !== e.pointerId) return;
      e.preventDefault();
      const r = stick.getBoundingClientRect();
      const cx = r.left + r.width/2, cy = r.top + r.height/2;
      let dx = e.clientX - cx, dy = e.clientY - cy;
      const max = r.width/2 - 6;
      const d = Math.hypot(dx,dy);
      if(d > max){ dx = dx/d*max; dy = dy/d*max; }
      setKnob(dx, dy, max);
      knob.classList.add('act');
    };

    stick.addEventListener('pointerdown', e=>{
      e.preventDefault();
      if(active !== null) return;
      active = e.pointerId;
      stick.setPointerCapture(e.pointerId);
      onMove(e);
    }, {passive:false});

    stick.addEventListener('pointermove', onMove, {passive:false});

    const end = e=>{
      if(active !== e.pointerId) return;
      active = null;
      resetKnob();
    };
    stick.addEventListener('pointerup', end);
    stick.addEventListener('pointercancel', end);
    stick.addEventListener('lostpointercapture', end);

    // A / B buttons
    const bindBtn = (el, key)=>{
      const press = e=>{
        e.preventDefault();
        el.classList.add('press');
        Input[key] = true;
        setTimeout(()=>{ Input[key] = false; el.classList.remove('press'); }, 10);
      };
      el.addEventListener('pointerdown', press, {passive:false});
      el.addEventListener('contextmenu', e=>e.preventDefault());
    };
    bindBtn($('#btnA'), 'a');
    bindBtn($('#btnB'), 'b');

    // canvas pointer (for menu games)
    this.canvas.addEventListener('pointerdown', e=>{
      const r = this.canvas.getBoundingClientRect();
      Input.ptr.x = (e.clientX - r.left)/r.width  * this.W;
      Input.ptr.y = (e.clientY - r.top )/r.height * this.H;
      Input.ptr.down = true;
      Input.ptr.just = true;
    }, {passive:true});
    this.canvas.addEventListener('pointermove', e=>{
      const r = this.canvas.getBoundingClientRect();
      Input.ptr.x = (e.clientX - r.left)/r.width  * this.W;
      Input.ptr.y = (e.clientY - r.top )/r.height * this.H;
    }, {passive:true});
    addEventListener('pointerup', ()=>{ Input.ptr.down = false; }, {passive:true});

    // prevent scroll while playing
    $('#player').addEventListener('touchmove', e=>{
      if(this.game) e.preventDefault();
    }, {passive:false});
  },

  /* ---------- Player ---------- */
  open(id){
    const meta = BY_ID[id];
    if(!meta) return;

    Sfx.init();
    Sfx.ctx?.resume?.();

    $('#load').classList.add('on');

    setTimeout(()=>{
      $('#player').classList.add('on');
      $('#pTitle').textContent = meta.title + (meta.is3D ? '  ·  3D' : '');

      // show touch UI only for touch devices
      const touchOn = !Device.isPC;
      $('#touch').classList.toggle('on', touchOn);
      $('#pcHint').classList.toggle('on', Device.isPC);

      this.resize();

      // build game
      try{
        this.gameObj = meta.create(this.ctx, this.W, this.H, {
          input: Input,
          sfx: Sfx,
          gameOver:(score)=>this.showModal('انتهت اللعبة', '💀', score,
                        'حاول مرة ثانية! يمكنك تحقيق رقم أفضل.'),
          win:(score)=>this.showModal('فزت!', '🏆', score,
                        'أداء رائع! هل تجرؤ على المحاولة مرة أخرى؟')
        });
        this.game = meta;
        this.lastT = now();
      }catch(err){
        console.error('Game init error:', err);
        this.exit();
      }

      $('#load').classList.remove('on');

      // Fullscreen on mobile = better immersion
      if(Device.isPC === false && document.fullscreenEnabled){
        this.goFull();
      }
    }, 120);
  },

  exit(){
    if(!this.game) return;
    $('#player').classList.remove('on');
    $('#modal').classList.remove('on');
    $('#touch').classList.remove('on');
    $('#pcHint').classList.remove('on');
    this.gameObj?.destroy?.();
    this.gameObj = null;
    this.game = null;
    Input.reset();
    Input.endFrame();
    if(document.fullscreenElement) document.exitFullscreen?.();
  },

  showModal(title, emoji, score, desc){
    $('#mTitle').textContent = title;
    $('#mEm').textContent = emoji;
    $('#mScore').textContent = score;
    $('#mDesc').textContent = desc;
    setTimeout(()=>$('#modal').classList.add('on'), 300);
  },

  toggleFull(){
    if(!document.fullscreenElement) this.goFull();
    else document.exitFullscreen?.();
  },
  goFull(){
    const el = $('#player');
    const req = el.requestFullscreen || el.webkitRequestFullscreen;
    req?.call(el).catch(()=>{});
  },

  /* ---------- Resize ---------- */
  resize(){
    const r = this.canvas.getBoundingClientRect();
    const dpr = this.dpr;
    const w = Math.max(1, Math.floor(r.width  * dpr));
    const h = Math.max(1, Math.floor(r.height * dpr));
    if(this.canvas.width !== w || this.canvas.height !== h){
      this.canvas.width = w;
      this.canvas.height = h;
    }
    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.W = r.width;
    this.H = r.height;
    this.gameObj?.resize?.(this.W, this.H);
  },

  /* ---------- Main Loop ---------- */
  startLoop(){
    const loop = (t)=>{
      requestAnimationFrame(loop);

      const dt = Math.min((t - this.lastT)/1000, 0.05);
      this.lastT = t;

      // FPS meter
      this.fpsFrames++;
      this.fpsAcc += dt;
      if(this.fpsAcc >= 0.5){
        this.fps = Math.round(this.fpsFrames/this.fpsAcc);
        this.fpsFrames = 0; this.fpsAcc = 0;
        this.updateFpsPill();
      }

      if(this.gameObj){
        Input.sample();
        try{
          this.gameObj.update(dt);
          this.gameObj.render();
        }catch(err){
          console.error('Game loop error:', err);
          this.exit();
        }
        Input.endFrame();

        // HUD
        const h = $('#pHud');
        const txt = this.gameObj.hud || '';
        if(h.textContent !== txt) h.textContent = txt;
      }
    };
    requestAnimationFrame(loop);
  },

  updateFpsPill(){
    const el = $('#fpsPill');
    const f = this.fps;
    el.textContent = f + ' FPS';
    el.classList.toggle('warn', f < 50 && f >= 30);
    el.classList.toggle('bad',  f < 30);
  }
};

/* ============================================================
   [GLSL] WebGL Background Shader — Aurora Gaming
   ============================================================ */
function initShaderBG(){
  const cv = $('#bgShader');
  if(Device.lowEnd) { cv.style.display='none'; return; }

  const gl = cv.getContext('webgl', {
    alpha:false, antialias:false, depth:false, stencil:false,
    premultipliedAlpha:false, preserveDrawingBuffer:false,
    powerPreference:'low-power'
  });
  if(!gl){ cv.style.display='none'; return; }

  const VS = `
    attribute vec2 p;
    void main(){ gl_Position = vec4(p, 0.0, 1.0); }
  `;
  const FS = `
    precision lowp float;
    uniform vec2  R;
    uniform float T;
    uniform vec2  M;

    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }

    void main(){
      vec2 u = gl_FragCoord.xy / R;
      vec2 q = u;
      q.x *= R.x / R.y;

      float t = T * 0.09;

      float a = sin(q.x * 3.4 + t * 2.1) * cos(q.y * 2.9 - t * 1.7);
      float b = sin((q.x + q.y) * 2.2 - t * 1.3);
      float c = cos(q.x * 5.1 - q.y * 3.7 + t * 0.9);

      vec3 c1 = vec3(0.00, 0.42, 0.72);
      vec3 c2 = vec3(0.42, 0.05, 0.72);
      vec3 c3 = vec3(0.72, 0.04, 0.32);

      vec3 col = mix(c1, c2, clamp(u.y * 1.25 + 0.28 * a, 0.0, 1.0));
      col = mix(col, c3, clamp(0.30 + 0.32 * b, 0.0, 1.0));
      col *= 0.14 + 0.20 * u.y;

      // soft mouse light
      vec2 mp = M / R;
      mp.x = 1.0 - mp.x;
      float md = distance(u, mp);
      col += vec3(0.00, 0.55, 0.75) * (0.055 / (1.0 + md * md * 60.0));

      // grain
      col += (hash(gl_FragCoord.xy + T) - 0.5) * 0.020;

      gl_FragColor = vec4(col, 1.0);
    }
  `;

  function sh(type, src){
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
      console.warn(gl.getShaderInfoLog(s)); return null;
    }
    return s;
  }
  const v = sh(gl.VERTEX_SHADER, VS);
  const f = sh(gl.FRAGMENT_SHADER, FS);
  if(!v || !f){ cv.style.display='none'; return; }

  const prog = gl.createProgram();
  gl.attachShader(prog, v); gl.attachShader(prog, f);
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)){ cv.style.display='none'; return; }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);

  const loc = gl.getAttribLocation(prog, 'p');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);

  const uR = gl.getUniformLocation(prog, 'R');
  const uT = gl.getUniformLocation(prog, 'T');
  const uM = gl.getUniformLocation(prog, 'M');

  let mouse = {x: innerWidth*0.5, y: innerHeight*0.4};
  addEventListener('pointermove', e=>{ mouse.x = e.clientX; mouse.y = e.clientY; }, {passive:true});

  const SCALE = 5; // heavy downscale = buttery smooth on weak devices
  function resize(){
    cv.width  = Math.max(2, Math.floor(innerWidth  / SCALE));
    cv.height = Math.max(2, Math.floor(innerHeight / SCALE));
    gl.viewport(0, 0, cv.width, cv.height);
  }
  resize();
  addEventListener('resize', resize);

  let t0 = now();
  function draw(){
    requestAnimationFrame(draw);
    if(document.hidden) return;
    const t = (now() - t0) / 1000;
    gl.uniform2f(uR, cv.width, cv.height);
    gl.uniform1f(uT, t);
    gl.uniform2f(uM, mouse.x / SCALE, mouse.y / SCALE);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  draw();
}

   [BOOT]
   ============================================================ */
(function boot(){
  // roundRect polyfill for older Safari
  if(!CanvasRenderingContext2D.prototype.roundRect){
    CanvasRenderingContext2D.prototype.roundRect = function(x,y,w,h,r){
      if(typeof r === 'number') r = [r,r,r,r];
      if(!Array.isArray(r)) r = [0,0,0,0];
      const [tl,tr,br,bl] = r.map(v=>Math.min(v, Math.min(w,h)/2));
      this.beginPath();
      this.moveTo(x+tl, y);
      this.lineTo(x+w-tr, y); this.quadraticCurveTo(x+w, y, x+w, y+tr);
      this.lineTo(x+w, y+h-br); this.quadraticCurveTo(x+w, y+h, x+w-br, y+h);
      this.lineTo(x+bl, y+h); this.quadraticCurveTo(x, y+h, x, y+h-bl);
      this.lineTo(x, y+tl); this.quadraticCurveTo(x, y, x+tl, y);
      this.closePath();
      return this;
    };
  }

  initShaderBG();
  App.init();

  // console signature
  console.log('%c⚡ ATLAS ENGINE','background:linear-gradient(90deg,#00e5ff,#ff2e88);color:#04060d;font-weight:900;padding:6px 16px;border-radius:8px;font-size:14px');
  console.log('%cالسلاسة عنوان المحاكي — 11 لعبة · 0 مكتبات خارجية','color:#7c8aab;font-size:11px');
})();
