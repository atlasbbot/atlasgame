<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATLAS - بوابة الألعاب</title>
<style>
body{margin:0;background:#05060a;color:#fff;font-family:system-ui,sans-serif;padding:20px}
h1{text-align:center;background:linear-gradient(90deg,#00e5ff,#ff2e88);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-size:32px;letter-spacing:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;max-width:1100px;margin:auto}
a{display:block;padding:20px;background:#0e1420;border:1px solid #1c2438;border-radius:16px;text-decoration:none;color:#fff;transition:.2s}
a:hover{border-color:#00e5ff;transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,229,255,.2)}
a .ico{font-size:42px;display:block;margin-bottom:8px}
a h3{margin:0 0 6px;font-size:15px}
a p{margin:0;color:#7c8aab;font-size:12px}
</style>
</head>
<body>
<h1>ATLAS</h1>
<div class="grid">
  <a href="https://playsnake.org/" target="_blank"><span class="ico">🐍</span><h3>Snake</h3><p>الأفعى الكلاسيكية</p></a>
  <a href="https://play2048.co/" target="_blank"><span class="ico">🔢</span><h3>2048</h3><p>دمج الأرقام</p></a>
  <a href="https://tetris.com/play-tetris" target="_blank"><span class="ico">🧩</span><h3>Tetris</h3><p>تتريس الرسمي</p></a>
  <a href="https://brutal-legend.surge.sh/" target="_blank"><span class="ico">🏆</span><h3>Brutal Legend</h3><p>HTML5 demo</p></a>
  <a href="https://hexgl.bkcore.com/play/" target="_blank"><span class="ico">🏎️</span><h3>HexGL</h3><p>سباق 3D حقيقي</p></a>
  <a href="https://browserquest.herokuapp.com/" target="_blank"><span class="ico">⚔️</span><h3>BrowserQuest</h3><p>مغامرة MMORPG</p></a>
  <a href="https://alteredqualia.com/xg/examples/animals_webgl.html" target="_blank"><span class="ico">🐘</span><h3>WebGL Demo</h3><p>عرض 3D</p></a>
  <a href="https://www.chromeexperiments.com/" target="_blank"><span class="ico">🧪</span><h3>Experiments</h3><p>مئات تجارب</p></a>
  <a href="https://js13kgames.com/" target="_blank"><span class="ico">🎮</span><h3>JS13K</h3><p>مئات ألعاب مفتوحة</p></a>
  <a href="https://itch.io/games/html5" target="_blank"><span class="ico">🕹️</span><h3>itch.io</h3><p>آلاف الألعاب</p></a>
